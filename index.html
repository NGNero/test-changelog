<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="relog-template" content="2">
<title>Changelog</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@460;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script>tailwind.config={darkMode:'media',theme:{extend:{fontFamily:{sans:['Inter'],mono:['JetBrains Mono']},colors:{ink:'#0d0f13',paper:'#fbfdff'}}}}</script>
</head>
<body class="bg-paper text-ink dark:bg-ink dark:text-paper font-sans font-[460] antialiased">
<main class="max-w-2xl mx-auto px-6 py-16">
<h1 id="t" class="text-3xl font-[600]"></h1>
<p id="d" class="opacity-70 mt-2"></p>
<div id="f" class="flex flex-wrap gap-2 mt-8 font-mono text-xs"></div>
<div id="l" class="mt-12 space-y-16"></div>
<button id="m" hidden class="mt-12 rounded-[24px] border border-ink/15 dark:border-paper/15 px-4 py-2 font-mono text-sm">Load more</button>
<footer class="mt-24 font-mono text-xs opacity-50">Powered by <a class="underline underline-offset-4" href="https://modcore-relog.pages.dev">Relog</a></footer>
</main>
<script>
const $ = (i) => document.getElementById(i);
const esc = (s) => { const x = document.createElement('i'); x.textContent = s; return x.innerHTML; };
let site = {}, posts = [], tag = '', shown = 0, size = 10;
const color = (n) => ((site.tags || []).find((x) => x.name === n) || {}).color || '#8a8f98';
const pill = (n, on) => '<button data-g="' + esc(n) + '" class="rounded-[24px] px-3 py-1" style="' + (on ? 'background:' + color(n) + ';color:#fff' : 'background:' + color(n) + '22;color:' + color(n)) + '">#' + esc(n) + '</button>';
const body = (p) => p.body !== undefined ? Promise.resolve(p.body) : fetch('posts/' + encodeURIComponent(p.id) + '.md').then((r) => r.ok ? r.text() : '');

function filters() {
  const used = [...new Set(posts.flatMap((p) => p.tags || []))];
  $('f').innerHTML = used.length > 1 ? '<button data-g="" class="rounded-[24px] px-3 py-1 ' + (tag ? 'opacity-60' : 'bg-ink/10 dark:bg-paper/10') + '">All</button>' + used.map((n) => pill(n, n === tag)).join('') : '';
}
function more() {
  const list = posts.filter((p) => !tag || (p.tags || []).includes(tag));
  list.slice(shown, shown + size).forEach((p) => {
    const a = document.createElement('article');
    a.id = 'v' + p.version;
    a.innerHTML = '<div class="flex flex-wrap items-center gap-3 font-mono text-xs">'
      + '<a href="#v' + encodeURIComponent(p.version) + '" class="rounded-[24px] bg-[var(--a)] text-white px-3 py-1">v' + esc(p.version) + '</a>'
      + '<span class="opacity-60">' + new Date(p.published_at * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) + '</span>'
      + (p.tags || []).map((n) => '<span style="color:' + color(n) + '">#' + esc(n) + '</span>').join('')
      + '</div><h2 class="text-xl font-[600] mt-3">' + esc(p.title) + '</h2><div data-b class="prose dark:prose-invert max-w-none mt-3"></div>';
    $('l').appendChild(a);
    body(p).then((b) => { a.querySelector('[data-b]').innerHTML = DOMPurify.sanitize(marked.parse(b || '')); });
  });
  shown += size;
  $('m').hidden = shown >= list.length;
  if (!list.length) $('l').innerHTML = '<p class="opacity-60">No entries yet.</p>';
}
function reset() { $('l').innerHTML = ''; shown = 0; filters(); more(); }

fetch('posts.json', { cache: 'no-cache' }).then((r) => r.json()).then((j) => {
  site = j.site || {};
  posts = j.posts || [];
  document.title = (site.name || 'Changelog') + ' · Changelog';
  document.documentElement.style.setProperty('--a', site.accent || '#1e5fff');
  $('t').textContent = site.name || 'Changelog';
  $('d').textContent = site.description || '';
  const h = decodeURIComponent(location.hash.slice(1)); // deep link to an older version
  const i = posts.findIndex((p) => 'v' + p.version === h);
  if (i >= size) size = i + 1;
  reset();
  size = 10;
  if (h) setTimeout(() => { const e = document.getElementById(h); if (e) e.scrollIntoView(); }, 400);
});
$('f').onclick = (e) => { if (e.target.dataset.g !== undefined) { tag = e.target.dataset.g; reset(); } };
$('m').onclick = more;
</script>
</body></html>
